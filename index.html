<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <div class="container bar">

                <p id="subtitle">Digital Signs Made <b>better.</b></p>
            </div>

            </div>

            <div class="headline-controls hidden" id="headline-controls">

                <button type="button" id="update-headline">Update Headline</button>
            </div>
        </div>

        <div class="headline-banner">
